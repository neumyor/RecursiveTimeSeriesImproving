[project]
name = "harnessing-ts"
version = "0.1.0"
description = "Python backend for a time-series tool-use harness built on DeepSeek Harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.9,<4.11",
  "deepseek-harness-sdk>=0.1.0rc7,<0.2",
  "fastapi>=0.116.0,<0.136.0",
  "mcp>=1.27,<2",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.20",
  "pydantic>=2.10.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
research = [
  "numpy>=2.0",
  "scipy>=1.14",
  "zstandard>=0.22",
  "torch>=2.5,<3",
  "statsforecast>=1.7",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.0",
]

[project.scripts]
ts-harness = "harnessing_ts.cli:main"
ts-harness-server = "harnessing_ts.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["backend/harnessing_ts"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
